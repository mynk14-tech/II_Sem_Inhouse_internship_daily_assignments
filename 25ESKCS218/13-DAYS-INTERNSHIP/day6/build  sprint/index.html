<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live User Directory</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef3f8;
}

.card{
transition:.3s;
}

.card:hover{
transform:scale(1.03);
}

.user-img{
width:90px;
height:90px;
border-radius:50%;
margin:auto;
margin-top:15px;
}

</style>

</head>

<body>

<div class="container py-5">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>Live User Directory</h2>

<span class="badge bg-primary fs-5" id="count">0</span>

</div>

<div class="row mb-4">

<div class="col-md-6">

<input
type="text"
class="form-control"
id="search"
placeholder="Search User">

</div>

<div class="col-md-3">

<button class="btn btn-success w-100" id="sortBtn">
Sort A-Z
</button>

</div>

<div class="col-md-3">

<button class="btn btn-danger w-100" onclick="loadUsers()">
Reload
</button>

</div>

</div>

<div id="user-container" class="row"></div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="script.js"></script>

</body>
</html>
